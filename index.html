<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YBP Official Website</title>
  <meta name="description" content="YBP Official Website - Latest updates, services and contact information">
  <meta name="keywords" content="YBP, YBP website, official YBP, YBP updates">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    /* NAVBAR */
    .navbar {
      background: #0d6efd;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 40px;
      width: 40px;
      border-radius: 50%;
    }

    .menu a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 60px 20px;
      background: white;
    }

    .hero h1 {
      font-size: 40px;
      color: #0d6efd;
    }

    .hero p {
      font-size: 18px;
      color: #333;
    }

    /* BUTTON */
    .btn {
      display: inline-block;
      padding: 12px 20px;
      background: #25D366;
      color: white;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 20px;
    }

    /* FOOTER */
    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        text-align: center;
      }

      .menu {
        margin-top: 10px;
      }
    }
  </style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <!-- ⚠️ अपना logo यहां रखें -->
    <img src="logo.png" alt="YBP Logo">
    <h3>YBP</h3>
  </div>

  <div class="menu">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>
</div>

<!-- HERO SECTION -->
<div class="hero">
  <h1>Welcome to YBP Website</h1>
  <p>Official platform for updates, services and information</p>

  <!-- WhatsApp Button -->
  <a class="btn" href="https://wa.me/91XXXXXXXXXX" target="_blank">
    WhatsApp Us
  </a>
</div>

<!-- FOOTER -->
<footer>
  © 2026 YBP Website | All Rights Reserved
</footer>

</body>
</html>
